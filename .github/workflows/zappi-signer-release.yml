# Builds, signs, and publishes zappi-signer for every desktop target.
#
# Trigger: push a tag named zappi-signer-v<semver> (for example
# zappi-signer-v0.1.2).
#
# The artifacts match what the one-line installer
# (web/install/signer.sh) downloads and verifies:
#   zappi-signer-<target>[.exe]          standalone binary
#   zappi-signer-<target>[.exe].sig      base64 raw Ed25519 signature
#   zappi-signer-<target>.provenance.json  version + binarySha256
#   zappi-signer-<target>[.exe].sha256
#   macos-keychain + macos-keychain.sig  (darwin targets)
#
# The signing key is the repo secret ZAPPI_SIGNER_RELEASE_KEY: base64 of a
# 64-byte Ed25519 secret (seed(32) || public-key(32)). Its public half must
# equal the PUBLISHER_PUBKEY_PEM pinned in web/install/signer.sh. The key is
# never logged. sign-release.mjs refuses to produce artifacts without it.
#
# After publishing, a canary job plays a real user: it fetches the live
# dev.zappi.money/signer/install one-liner, runs it, and smoke-tests the
# installed binary (with the installed keychain helper). It retries over
# ~5 minutes to ride out GitHub asset propagation and the web repo's deploy
# lag, and warns (instead of failing) if the served pin is still the
# previous release after those retries.

name: zappi-signer release

on:
  push:
    tags:
      - 'zappi-signer-v*'

permissions:
  contents: write

concurrency:
  group: zappi-signer-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
            keychain: true
          - os: macos-14
            target: darwin-x64
            keychain: true
          - os: ubuntu-24.04
            target: linux-x64
            keychain: false
          - os: ubuntu-24.04-arm
            target: linux-arm64
            keychain: false
          - os: windows-2022
            target: win-x64
            keychain: false
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      ZAPPI_SIGNER_VERSION: ${{ github.ref_name }}
      ZAPPI_SIGNER_COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      # Guard against publishing a stale binary under an unchanged version:
      # the tag (zappi-signer-v<semver>) must equal package.json's version.
      # This is what allowed released v0.1.2 to ship without the
      # server-pot flow (trust-server / finalize / provision <potId>).
      - name: Verify tag matches package.json version
        run: |
          set -euo pipefail
          pkg_version="$(node -p "require('./package.json').version")"
          expected="zappi-signer-v${pkg_version}"
          if [ "${{ github.ref_name }}" != "$expected" ]; then
            echo "::error::tag ${{ github.ref_name }} does not match package.json version $pkg_version (expected tag $expected)."
            echo "::error::Bump package.json, commit, then retag."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'

      - name: Install, typecheck, and test
        run: |
          npm ci
          npm run typecheck
          npm test

      # typecheck is `tsc --noEmit` and does not write dist/index.js.
      - name: Build standalone binary
        run: |
          set -euo pipefail
          npm run build:bin

      - name: Build macOS keychain helper
        if: matrix.keychain
        run: |
          set -euo pipefail
          # The helper must match the target's arch: the darwin-x64 artifact
          # ships an x86_64 helper even though this runner is arm64.
          arch_args=""
          if [ "$TARGET" = "darwin-x64" ]; then
            arch_args="-arch x86_64"
          fi
          clang -O2 $arch_args -o dist/bin/macos-keychain native/macos-keychain.c \
            -framework Security -framework CoreFoundation

      # Gate the release on the real artifact: the wallet-first provision path
      # does full Spark gRPC init but no backend calls. Skips on linux (no
      # secret service); catches runtime-specific stalls (Bun-compiled gRPC
      # failure, see docs/agent.md). The smoke run points HOME at a scratch
      # dir, so the darwin keychain helper (normally found at
      # ~/.zappi-signer/macos-keychain as installed by the one-line installer)
      # must be passed explicitly via ZAPPI_SIGNER_KEYCHAIN_HELPER.
      - name: Smoke-test standalone binary
        if: matrix.keychain || matrix.target == 'win-x64'
        run: |
          set -euo pipefail
          ext=""
          if [ "$TARGET" = "win-x64" ]; then
            ext=".exe"
          fi
          case "$TARGET" in
            darwin-*) export ZAPPI_SIGNER_KEYCHAIN_HELPER="$PWD/dist/bin/macos-keychain" ;;
          esac
          # Opt-in diagnostics from the binary itself (safe cause tokens only).
          export ZAPPI_SIGNER_DEBUG=1
          node scripts/smoke-bin.mjs "dist/bin/zappi-signer-${TARGET}${ext}" 120000

      - name: Sign release artifacts
        env:
          ZAPPI_SIGNER_RELEASE_KEY: ${{ secrets.ZAPPI_SIGNER_RELEASE_KEY }}
        run: |
          set -euo pipefail
          ext=""
          if [ "$TARGET" = "win-x64" ]; then
            ext=".exe"
          fi
          node scripts/sign-release.mjs "dist/bin/zappi-signer-${TARGET}${ext}" --provenance
          if [ -f dist/bin/macos-keychain ]; then
            node scripts/sign-release.mjs dist/bin/macos-keychain
          fi

      - name: Stage release files
        run: |
          set -euo pipefail
          ext=""
          if [ "$TARGET" = "win-x64" ]; then
            ext=".exe"
          fi
          stage="release-stage"
          mkdir -p "$stage"
          base="dist/bin/zappi-signer-${TARGET}${ext}"
          cp "$base" "$base.sig" "$base.sha256" "$base.provenance.json" "$stage/"
          if [ -f dist/bin/macos-keychain ]; then
            cp dist/bin/macos-keychain dist/bin/macos-keychain.sig dist/bin/macos-keychain.sha256 "$stage/"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: signer-${{ matrix.target }}
          if-no-files-found: error
          path: release-stage/*

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: signer-*
          merge-multiple: true
          path: artifacts

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ github.token }}

  canary:
    name: canary — install via the live one-liner
    needs: publish
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install from dev.zappi.money/signer/install and smoke the result
        run: |
          set -euo pipefail
          new_tag="${{ github.ref_name }}"
          work_dir="$(mktemp -d)"
          installer="$work_dir/canary-installer.sh"
          attempts=6
          attempt=1
          # ~5 minutes of retries: GitHub release-asset propagation and the
          # web repo's deploy to dev.zappi.money are both briefly laggy.
          while [ "$attempt" -le "$attempts" ]; do
            echo "=== canary attempt $attempt/$attempts ==="

            if ! curl -fsSL --retry 3 --max-time 60 https://dev.zappi.money/signer/install -o "$installer"; then
              echo "canary: could not fetch the installer from dev.zappi.money"
              attempt=$((attempt + 1)); sleep 55; continue
            fi

            served_tag="$(sed -n 's/^RELEASE_TAG="\(.*\)"$/\1/p' "$installer" | head -n 1)"
            if [ -z "$served_tag" ]; then
              echo "canary: could not parse the served RELEASE_TAG pin"
              attempt=$((attempt + 1)); sleep 55; continue
            fi
            echo "canary: dev.zappi.money serves $served_tag (this release: $new_tag)"

            install_out="$(sh "$installer" 2>&1)" && install_rc=0 || install_rc=$?
            printf '%s\n' "$install_out"
            if [ "$install_rc" -ne 0 ]; then
              echo "canary: installer exited $install_rc"
              attempt=$((attempt + 1)); sleep 55; continue
            fi

            installed_tag="$(printf '%s\n' "$install_out" | sed -n 's/^Installed release: //p' | head -n 1)"
            if [ -z "$installed_tag" ]; then
              echo "canary: installer output did not name the installed release"
              attempt=$((attempt + 1)); sleep 55; continue
            fi
            echo "canary: installer installed $installed_tag"

            bin_path="$HOME/.zappi-signer/bin/$installed_tag/darwin-arm64/zappi-signer"
            if [ ! -x "$bin_path" ]; then
              echo "canary: installed binary not found or not executable at $bin_path"
              attempt=$((attempt + 1)); sleep 55; continue
            fi

            # The installed helper lands at ~/.zappi-signer/macos-keychain;
            # smoke-bin needs it explicitly for its keychain write/read probe.
            export ZAPPI_SIGNER_KEYCHAIN_HELPER="$HOME/.zappi-signer/macos-keychain"
            if node scripts/smoke-bin.mjs "$bin_path" 120000; then smoke_rc=0; else smoke_rc=$?; fi

            if [ "$served_tag" != "$new_tag" ]; then
              # Deploy lag: the web repo still pins the previous release. The
              # user-facing flow is what we just exercised — if it works,
              # this is a pass with a warning, not a release failure.
              if [ "$smoke_rc" -eq 0 ]; then
                echo "::warning::canary PASS with warning: dev.zappi.money still serves $served_tag (web deploy lag). The served, user-facing install works end-to-end; the $new_tag assets were already gated by the build smoke job."
                exit 0
              fi
              echo "::error::canary FAIL: the served pin $served_tag installed but its binary failed smoke — the user-facing install flow is broken."
              exit 1
            fi

            if [ "$installed_tag" != "$new_tag" ]; then
              # Served pin is this release, but the installer had to fall
              # back: the new assets are missing or failing verification.
              # Retry — asset propagation usually resolves within minutes.
              echo "canary: installer fell back to $installed_tag — $new_tag assets are missing or not verifying yet"
              attempt=$((attempt + 1)); sleep 55; continue
            fi

            if [ "$smoke_rc" -eq 0 ]; then
              echo "canary: PASS — $new_tag was installed by the public one-liner and the installed binary passed smoke"
              exit 0
            fi
            echo "canary: $new_tag installed but smoke failed (rc=$smoke_rc)"
            attempt=$((attempt + 1)); sleep 55
          done

          echo "::error::canary FAIL: $new_tag could not be installed and smoked via https://dev.zappi.money/signer/install after $attempts attempts (~5 minutes)."
          exit 1